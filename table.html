<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Manager</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div class="container">
        <form id="entryForm">
            
            <div class="input-group">
                <label for="Title">Class Name</label>
                <input type="text" id="Title" required>
            </div>
            <div class="input-group">
                <label for="totalParticipants">Number Of People</label>
                <input type="number" id="totalParticipants" required>
            </div>
            <div class="input-group">
                <label for="Details">Description</label>
                <textarea id="Details" rows="3" required></textarea>
            </div>
            <button type="submit">Add Course</button>
        </form>
    </div>

    <div class="course-list" id="courseList"></div>
    
    <script>
        document.getElementById('entryForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const title = document.getElementById('Title').value.trim();
            const count = document.getElementById('totalParticipants').value.trim();
            const details = document.getElementById('Details').value.trim();
            
            if (!title || !count || !details) {
                alert('All fields must be filled!');
                return;
            }
            
            createCourseEntry(title, count, details);
            this.reset();
        });

        function createCourseEntry(title, count, details) {
            const entryDiv = document.createElement('div');
            entryDiv.classList.add('course-entry');
            
            entryDiv.innerHTML = `
                <h3><strong>Class Name :</strong> ${title}</h3>
                <p><strong>Participants :</strong> ${count}</p>
                <p><strong>Details :</strong> ${details}</p>
            `;
            
            entryDiv.addEventListener('click', function() {
                document.querySelectorAll('.course-entry').forEach(entry => entry.classList.remove('highlight'));
                entryDiv.classList.add('highlight');
                console.log({ title, count, details });
            });

            entryDiv.addEventListener('dblclick', function() {
                entryDiv.remove();
                console.log('Entry removed');
            });

            entryDiv.addEventListener('mouseover', () => entryDiv.style.backgroundColor = '#d0f0d0');
            entryDiv.addEventListener('mouseout', () => entryDiv.style.backgroundColor = '');
            
            entryDiv.addEventListener('click', function() {
                alert(`Title: ${title}\nParticipants: ${count}\nDetails: ${details}`);
            });
            
            document.getElementById('courseList').appendChild(entryDiv);
        }
    </script>
</body>
</html>
